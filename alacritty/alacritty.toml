[general]
import = [
    "dracula.toml"
]

working_directory = "C:/Dev"

[env]
TERM = "xterm-256color"

[window]
# opacity = 0.9
dimensions = { columns = 132, lines = 43 }

[font]
size = 16 
normal = { family = "Fira Code", style = "Regular" }

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "off" }

[terminal]
shell = "cmd"

[mouse]
hide_when_typing = true
